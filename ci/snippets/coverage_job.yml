name: Chapter 11 Coverage Gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  coverage:
    name: Coverage (Ch11)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run coverage with branch gate
        working-directory: software-testing-handbook
        run: |
          pytest examples/ch11 \
            --cov=examples.ch11 \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=80
          coverage report --show-missing --skip-covered > coverage.txt
          cat coverage.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            software-testing-handbook/coverage.xml
            software-testing-handbook/htmlcov/
            software-testing-handbook/coverage.txt

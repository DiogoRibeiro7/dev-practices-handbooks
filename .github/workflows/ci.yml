name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-logging-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: logging-book
          compiler: pdflatex
          args: -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=dist

      - name: Run build
        run: make pdf
        working-directory: logging-book

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: logging-book-pdf
          path: logging-book/dist/main.pdf

name: Content Request
description: Request new content or edits to the logging book.
title: "Content: "
labels:
  - content
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe the content change you want.
      placeholder: Add a section on...
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this change useful?
      placeholder: This helps clarify...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which chapter or file should be updated?
      placeholder: logging-book/chapters/...
